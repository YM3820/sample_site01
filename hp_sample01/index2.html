<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ボタン操作アニメーション</title>
    <link rel="stylesheet" href="assets/styles/button-motion.css" />
    <!-- 登場前の非表示を JS 有効時だけ適用するため、head で同期読み込みする -->
    <script src="assets/scripts/button-motion.js"></script>
    <style>
      :root {
        --page-bg: #fbf7f0;
        --page-surface: #fff;
        --page-text: #2b2b2b;
        --page-muted: #666;
        --page-line: #e8dfd2;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--page-text);
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          "Yu Gothic UI",
          sans-serif;
        line-height: 1.7;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px 96px;
      }

      .hero {
        display: grid;
        min-height: 88vh;
        place-content: center;
        text-align: center;
      }

      .hero h1 {
        margin: 0 0 0.5em;
        font-size: clamp(1.8rem, 6vw, 3rem);
        line-height: 1.3;
      }

      .hero p {
        margin: 0 auto 2.5em;
        max-width: 36em;
        color: var(--page-muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        align-items: center;
      }

      section.panel {
        margin-top: 48px;
        padding: 32px 24px;
        background: var(--page-surface);
        border: 1px solid var(--page-line);
        border-radius: 16px;
      }

      section.panel h2 {
        margin: 0 0 0.25em;
        font-size: 1.35rem;
      }

      section.panel > p {
        margin: 0 0 1.5em;
        color: var(--page-muted);
      }

      .status {
        min-height: 1.7em;
        margin: 1em 0 0;
        text-align: center;
        font-weight: 700;
      }

      footer {
        padding: 24px 16px 48px;
        text-align: center;
        color: var(--page-muted);
        font-size: 0.875rem;
      }

      @media (max-width: 480px) {
        .actions .motion-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" id="burst" aria-labelledby="burst-title">
        <h2 id="burst-title">クリック演出（任意）</h2>
        <p>
          押した位置から火の粉が広がります。
          では、押した位置から花火が打ち上がり画面いっぱいに開きます。
          キーボード操作ではボタン中央から広がります。
        </p>
        <div class="actions" data-motion-group>
          <button
            class="motion-btn motion-btn--primary"
            type="button"
            data-motion-effect="fireworks"
            data-motion-pulse="off"
          >
            お祝いする
          </button>
          <button
            class="motion-btn motion-btn--secondary"
            type="button"
            data-motion-effect="burst"
          >
            もう一度
          </button>
        </div>
      </section>
    </main>

    <footer>ボタンテスト 花火</footer>

    <script>
      (function () {
        var button = document.getElementById("submit-demo");
        var status = document.getElementById("submit-status");

        button.addEventListener("click", async function () {
          ButtonMotion.setLoading(button, true);
          status.textContent = "送信しています…";
          try {
            await new Promise(function (resolve) {
              setTimeout(resolve, 1800);
            });
            status.textContent = "送信が完了しました。";
          } finally {
            ButtonMotion.setLoading(button, false);
          }
        });
      })();
    </script>
  </body>
</html>
